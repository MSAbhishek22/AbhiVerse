[package]
name = "abhiverse-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ABHIVERSE coordination API (Task 001: health check only)"

[dependencies]
axum = "0.8"
abhiverse-protocol = { path = "../../crates/protocol" }
abhiverse-identity = { path = "../../crates/identity" }
abhiverse-file-transfer = { path = "../../crates/file-transfer" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

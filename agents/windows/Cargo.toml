[package]
name = "abhiverse-agent-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ABHIVERSE device agent for Windows (Task 001: version + clean shutdown)"

[[bin]]
name = "abhiverse-agent"
path = "src/main.rs"

[dependencies]
abhiverse-protocol = { path = "../../crates/protocol" }
abhiverse-identity = { path = "../../crates/identity" }
abhiverse-file-transfer = { path = "../../crates/file-transfer" }
ureq = { version = "2", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

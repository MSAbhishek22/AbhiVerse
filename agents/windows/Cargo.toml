[package]
name = "abhiverse-agent-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ABHIVERSE device agent for Windows (Task 001: version + clean shutdown)"

[[bin]]
name = "abhiverse-agent"
path = "src/main.rs"

[dependencies]
abhiverse-protocol = { path = "../../crates/protocol" }
abhiverse-identity = { path = "../../crates/identity" }
abhiverse-file-transfer = { path = "../../crates/file-transfer" }
abhiverse-win-input = { path = "../../crates/win-input" }
openh264 = "0.6"
bytes = "1"
ureq = { version = "2", features = ["json"] }
qrcode = { version = "0.14", default-features = false }
webrtc = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Abhiverse staging stack: Caddy (TLS) -> API, coturn relay.
# Copy .env.example to .env and fill it in first. See README.md.
services:
  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      ABHIVERSE_TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      ABHIVERSE_TURN_URLS: turn:${DOMAIN:?set DOMAIN in .env}:3478
    volumes:
      - abhiverse_data:/data
    # Not published: only Caddy talks to the API.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${DOMAIN:?set DOMAIN in .env}
      - --no-cli
      - --fingerprint
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"

volumes:
  abhiverse_data:
  caddy_data:
  caddy_config:

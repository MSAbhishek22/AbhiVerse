[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/identity",
    "crates/file-transfer",
    "crates/win-input",
    "server/api",
    "agents/windows",
]

[workspace.package]
version = "0.5.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/YOUR-USERNAME/abhiverse"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
